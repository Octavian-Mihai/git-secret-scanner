# Publishes to PyPI via trusted publishing (no API token stored anywhere).
# One-time setup: see RELEASING.md. Publishing a GitHub Release triggers this (or run it manually).
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
