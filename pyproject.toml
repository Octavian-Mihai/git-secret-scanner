[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsecrets"
dynamic = ["version"]
description = "Find API keys and tokens (regex + entropy) in files, full git history, and as a pre-commit hook"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["secrets", "git", "security", "pre-commit", "gitleaks", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/Octavian-Mihai/git-secret-scanner"
Issues = "https://github.com/Octavian-Mihai/git-secret-scanner/issues"

[project.scripts]
gitsecrets = "gitsecrets.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gitsecrets.__version__" }

[tool.setuptools.packages.find]
include = ["gitsecrets*"]

[tool.setuptools.package-data]
gitsecrets = ["rules.toml"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["gitsecrets"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
